name: attested-rng build & sign

# Builds, pushes, and keyless-signs the attested-rng image on changes to its
# directory. Same shape `enclava init` scaffolds (cosign 3.x portable DSSE +
# provenance + SBOM attestations), adapted for the monorepo: subdir context
# and a per-app image name. The signer subject pinning this identity is the
# path of THIS file — see the app README's create command.

on:
  push:
    branches: [main]
    paths: ["attested-rng/**", ".github/workflows/attested-rng.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/attested-rng

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: attested-rng
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        # v4.1.2 — cosign 3.x, portable DSSE material (legacy 2.x .sig fails
        # enclava's material fetch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image (keyless — GitHub OIDC → Fulcio)
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Job summary
        run: |
          {
            echo "### attested-rng — built & signed :lock:"
            echo ""
            echo "**Image:** \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Deploy into your org (see attested-rng/README.md):"
            echo '```bash'
            echo "enclava create --image ${{ env.IMAGE }}:latest \\"
            echo "  --signer-subject https://github.com/${{ github.repository }}/.github/workflows/attested-rng.yml@refs/heads/main"
            echo "enclava deploy --image ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} --storage-password-file ~/attested-rng.password"
            echo '```'
            echo ""
            echo "_If packages are private in your repo: flip this one to public (GitHub → Packages → attested-rng → Package settings)._"
          } >> "$GITHUB_STEP_SUMMARY"
